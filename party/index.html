<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Party Planning Playbook</title>
<meta name="description" content="64 done-for-you party themes with tap-to-shop Amazon supply lists, checklists, menus and games.">
<meta name="theme-color" content="#FBF4EA"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#2b2b2b;--cream:#FBF4EA;--line:#EFE3CF;--acc:#C8664B;--sage:#8FA58A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:#fff;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.hero{background:var(--cream);border:1px solid var(--line);border-radius:22px;padding:26px 20px;margin-bottom:18px}
.kick{letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700;font-size:12px}
.hero h1{font-size:34px;line-height:1.05;margin-top:8px}
.hero p{color:#555;margin:10px 0 0}
.dots span{display:inline-block;width:18px;height:18px;border-radius:50%;margin:14px 6px 0 0}
.search{width:100%;font-size:17px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;margin:6px 0 10px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips a{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:var(--cream);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.group h2{font-size:22px;margin:22px 0 10px;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;min-height:112px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.card b{font-family:Fraunces,Georgia,serif;font-size:17px;display:block;line-height:1.2}
.card small{display:block;color:#888;margin-top:8px;font-size:13px}
.card .prog{font-size:12px;color:var(--sage);font-weight:700;margin-top:4px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:14px;padding:15px 16px;font-size:16px}
.top{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.top .wrap{padding:10px 16px;display:flex;align-items:center;gap:10px}
.top a{color:var(--acc);text-decoration:none;font-weight:700;font-size:16px;padding:6px 0}
.band{background:var(--cream);border-radius:20px;padding:20px;border-left:8px solid var(--c);margin:14px 0}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:20px;padding:4px 10px;margin-bottom:8px}
.band h1{font-size:28px;line-height:1.1}.band .tl{font-style:italic;color:#666;margin-top:4px}.band .pal{font-size:13px;color:#888;margin-top:4px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0}
.sum .big{font-size:22px;font-weight:700}.sum small{color:#ccc;display:block}
.pbar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 6px}.pfill{height:100%;background:var(--sage);transition:width .3s}.ptxt{font-weight:700;color:var(--sage);font-size:15px;margin-bottom:6px}
.how{font-size:14px;color:#666;margin:6px 2px 12px}
.item{display:flex;gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;background:#fff}
.item.done{opacity:.55;background:#f7f7f2}
.chk{flex:0 0 58px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--sage)}
.ib{flex:1;padding:12px 12px 12px 0;min-width:0}
.ib .cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#999;font-weight:700}
.ib .nm{font-weight:600;margin:3px 0 8px;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:700;font-size:17px}
.shop{background:var(--acc);color:#fff;padding:13px 16px;min-height:48px;display:inline-flex;align-items:center;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap}
.sec{margin:22px 0}.sec h3{font-size:20px;color:var(--acc);border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.sec ul{margin:0;padding-left:20px}.sec li{margin:6px 0}
.ck{list-style:none;padding:0!important}.ck li{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.ck input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:var(--sage)}
.sec2{background:#fff;border:1.5px solid var(--ink);color:var(--ink);margin-top:10px}
.note{font-size:12.5px;color:#999;margin-top:10px}
.reset{background:none;border:none;color:#999;text-decoration:underline;font-size:13px;padding:8px 0}
footer{color:#aaa;font-size:12px;text-align:center;margin-top:30px}
.tlg{display:grid;gap:4px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style></head><body>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dp = a => 'https://www.amazon.com/dp/' + a + (ASSOC_TAG ? '?tag=' + encodeURIComponent(ASSOC_TAG) : '');
const KEY = 'ppb-v1';
const st = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const isOn = k => !!st[k];
const groups = [...new Set(D.themes.map(t => t.age))];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
function home(q=''){
  q = q.trim().toLowerCase();
  let h = `<div class="wrap"><div class="hero"><div class="kick">Done-for-you party planning</div><h1>The Party Planning Playbook</h1>
  <p>${D.themes.length} ready-to-shop party themes for every age &amp; occasion. Pick a theme, tap each item to add it on Amazon, and check it off as you go.</p>
  <div class="dots"><span style="background:#C8664B"></span><span style="background:#E9B44C"></span><span style="background:#8FA58A"></span><span style="background:#7FA7C9"></span><span style="background:#E8A6B5"></span></div></div>
  <a class="btn sec2" href="#timeline">📋 Master planning timeline (8 weeks → after)</a>
  <input class="search" id="q" placeholder="Search themes (e.g. western, baby, Halloween)" value="${esc(q)}">
  <div class="chips">${groups.map(g=>`<a href="#g-${slug(g)}" onclick="event.preventDefault();document.getElementById('g-${slug(g)}').scrollIntoView({behavior:'smooth'})">${esc(g)}</a>`).join('')}</div>`;
  for (const g of groups){
    const ts = D.themes.filter(t => t.age===g && (!q || (t.theme+' '+t.age+' '+t.tagline).toLowerCase().includes(q)));
    if (!ts.length) continue;
    h += `<div class="group" id="g-${slug(g)}"><h2>${esc(g)}</h2><div class="grid">` + ts.map(t=>{
      const n = t.items.filter(p=>isOn(t.id+':'+p.asin)).length;
      return `<a class="card" style="--c:${t.acc}" href="#t/${t.id}"><b>${esc(t.theme)}</b><small>${t.items.length} items · ~$${t.total.toFixed(0)}</small>${n?`<div class="prog">✓ ${n}/${t.items.length} added</div>`:''}</a>`}).join('') + `</div></div>`;
  }
  h += `<footer>Prices checked on Amazon.com ${esc(D.checked)}. Prices & availability change.${ASSOC_TAG?'<br>As an Amazon Associate we may earn from qualifying purchases.':''}</footer></div>`;
  $('#app').innerHTML = h;
  const qi = $('#q'); qi.oninput = () => { const v=qi.value; home(v); const n=$('#q'); n.focus(); n.setSelectionRange(v.length,v.length); };
}
function bar(){ return `<div class="top"><div class="wrap"><a href="#">← All themes</a></div></div>`; }
function theme(id){
  const t = D.themes.find(x=>x.id===id); if(!t) return home();
  const cnt = () => t.items.filter(p=>isOn(t.id+':'+p.asin)).length; const pct = () => Math.round(100*cnt()/t.items.length);
  const left = () => t.items.filter(p=>!isOn(t.id+':'+p.asin)).reduce((s,p)=>s+parseFloat(p.price.replace(/[$,]/g,'')),0);
  const ul = (arr, ck, pre) => ck ? `<ul class="ck">${arr.map((x,i)=>`<li><input type="checkbox" data-k="${t.id}:${pre}${i}" ${isOn(t.id+':'+pre+i)?'checked':''}><span>${esc(x)}</span></li>`).join('')}</ul>` : `<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  let h = bar() + `<div class="wrap" style="--c:${t.acc}">
  <div class="band"><span class="tag">${esc(t.age)}</span><h1>${esc(t.theme)}</h1><div class="tl">${esc(t.tagline)}</div><div class="pal">Palette: ${esc(t.colors)}</div></div>
  <div class="sum"><div><small>Estimated total · ${t.items.length} items</small><span class="big">$${t.total.toFixed(2)}</span></div><div style="text-align:right"><small>Still to add</small><span class="big" id="left">$${left().toFixed(2)}</span></div></div>
  <div class="pbar"><div class="pfill" id="pfill" style="width:${pct()}%"></div></div><div class="ptxt" id="ptxt">${cnt()} of ${t.items.length} added</div>
  <div class="how">Tap <b>Shop on Amazon</b> → tap <b>Add to Cart</b> → tap back to return here → check the box. Your checkmarks are saved on this phone.</div>
  ${t.items.map(p=>{const k=t.id+':'+p.asin;return `<div class="item ${isOn(k)?'done':''}"><label class="chk"><input type="checkbox" data-k="${k}" data-item="1" ${isOn(k)?'checked':''} aria-label="Added ${esc(p.name)}"></label>
   <div class="ib"><div class="cat">${esc(p.cat)}</div><div class="nm">${esc(p.name)}</div><div class="row"><span class="price">${esc(p.price)}</span><a class="shop" href="${dp(p.asin)}">Shop on Amazon →</a></div></div></div>`}).join('')}
  <div class="note">Most tableware sets serve 20–25 guests; add more on Amazon for bigger parties. Prices checked ${esc(D.checked)} and may change.</div>
  <div class="sec"><h3>Theme to-dos</h3>${ul(t.tasks,1,'task')}</div>
  <div class="sec"><h3>Decor setup</h3>${ul(t.decor,1,'decor')}</div>
  <div class="sec"><h3>Menu ideas</h3>${ul(t.menu)}</div>
  <div class="sec"><h3>Activities &amp; games</h3>${ul(t.activities)}</div>
  <a class="btn sec2" href="#timeline">📋 Open the master planning timeline</a>
  <button class="reset" id="reset">Reset checkmarks for this theme</button>
  <footer>${ASSOC_TAG?'As an Amazon Associate we may earn from qualifying purchases.':''}</footer></div>`;
  $('#app').innerHTML = h; const sy=sessionStorage.getItem('y:'+id); window.scrollTo(0, sy?+sy:0);
  document.querySelectorAll('a.shop').forEach(a=>a.onclick=()=>sessionStorage.setItem('y:'+id, window.scrollY));
  document.querySelectorAll('input[data-k]').forEach(cb=>cb.onchange=()=>{ st[cb.dataset.k]=cb.checked; if(!cb.checked) delete st[cb.dataset.k]; save();
    if(cb.dataset.item){ cb.closest('.item').classList.toggle('done',cb.checked); $('#left').textContent='$'+left().toFixed(2); $('#pfill').style.width=pct()+'%'; $('#ptxt').textContent=cnt()+' of '+t.items.length+' added'+(cnt()===t.items.length?' 🎉 All set!':'');} });
  $('#reset').onclick=()=>{ Object.keys(st).forEach(k=>{if(k.startsWith(t.id+':')) delete st[k]}); save(); theme(id); };
}
function timeline(){
  let h = bar() + `<div class="wrap"><div class="band" style="--c:#C8664B"><span class="tag">Master timeline</span><h1>Party Planning Checklist</h1><div class="tl">Works for any party, any age.</div></div>`;
  D.timeline.forEach(([when,title,its],j)=>{ h += `<div class="sec"><div class="kick" style="color:var(--sage)">${esc(when)}</div><h3>${esc(title)}</h3><ul class="ck">${its.map((x,i)=>`<li><input type="checkbox" data-k="tl:${j}:${i}" ${isOn('tl:'+j+':'+i)?'checked':''}><span>${esc(x)}</span></li>`).join('')}</ul></div>`; });
  h += `<button class="reset" id="reset">Reset timeline checkmarks</button></div>`;
  $('#app').innerHTML = h; window.scrollTo(0,0);
  document.querySelectorAll('input[data-k]').forEach(cb=>cb.onchange=()=>{ if(cb.checked) st[cb.dataset.k]=1; else delete st[cb.dataset.k]; save(); });
  $('#reset').onclick=()=>{ Object.keys(st).forEach(k=>{if(k.startsWith('tl:')) delete st[k]}); save(); timeline(); };
}
function route(){ const h=location.hash.slice(1); if(h.startsWith('t/')) theme(h.slice(2)); else if(h==='timeline') timeline(); else home(); }
window.addEventListener('hashchange', route); route();
